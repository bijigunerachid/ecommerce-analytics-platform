# Included in every location that serves the app (nginx does not inherit add_header into a
# location that sets its own headers). API responses get their headers from the backend (helmet).
#
# CSP: scripts only from this origin (no inline scripts), API calls only to this origin.
# style-src needs 'unsafe-inline' for style attributes (chart bar widths, colors).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
