name: ecommerce-analytics

services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Test database used by the automated test suite (see docker/postgres/init).
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ecommerce_test}
    ports:
      # Bound to localhost only so the database is not exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process acts as broker and controller.
  kafka:
    image: apache/kafka:4.2.1
    container_name: ecommerce-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners:
      #   EXTERNAL  localhost:9092  for programs on your machine (the backend, tests)
      #   INTERNAL  kafka:29092     for other containers on the Compose network (Spark)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the outbox relay, never by typos in producer code.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Spark Structured Streaming: Kafka → validation → Parquet history + PostgreSQL aggregates.
  spark-streaming:
    &analytics
    build: ./analytics
    image: ecommerce-analytics:dev
    container_name: ecommerce-spark-streaming
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ecommerce_test}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-ecommerce}
    volumes:
      # Parquet history, quarantine, and streaming checkpoints.
      - analytics-data:/data
    ports:
      # Spark UI for the streaming job: http://localhost:4040
      - "127.0.0.1:4040:4040"

  # Batch job: rebuilds all aggregates from the Parquet history (run on demand).
  #   docker compose stop spark-streaming
  #   docker compose run --rm spark-rebuild
  #   docker compose start spark-streaming
  spark-rebuild:
    <<: *analytics
    container_name: ecommerce-spark-rebuild
    restart: "no"
    profiles: [batch]
    ports: []
    command: ["spark-submit", "--driver-memory", "1g", "bin/rebuild_aggregates.py"]

  # Analytics test suite (uses the test database and a temporary data directory):
  #   docker compose run --rm analytics-tests
  analytics-tests:
    <<: *analytics
    container_name: ecommerce-analytics-tests
    restart: "no"
    profiles: [test]
    ports: []
    volumes:
      # Mount the source so tests run against the working copy without rebuilding.
      - ./analytics:/app
    command: ["sh", "-c", "ruff check --no-cache . && ruff format --no-cache --check . && pytest -p no:cacheprovider"]

volumes:
  postgres-data:
  kafka-data:
  analytics-data:
