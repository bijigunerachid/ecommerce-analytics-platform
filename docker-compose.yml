name: ecommerce-analytics

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${CONTAINER_PREFIX:-ecommerce}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Test database used by the automated test suite (see docker/postgres/init).
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ecommerce_test}
    ports:
      # Bound to localhost only so the database is not exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process acts as broker and controller.
  kafka:
    image: apache/kafka:4.2.1
    container_name: ${CONTAINER_PREFIX:-ecommerce}-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client listeners:
      #   EXTERNAL  localhost:9092  for programs on your machine (the backend, tests)
      #   INTERNAL  kafka:29092     for other containers on the Compose network (Spark)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the outbox relay, never by typos in producer code.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # One-shot: applies database migrations, then exits. Everything that needs the schema waits
  # for it to finish successfully.
  migrate:
    &backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ecommerce-backend:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_PREFIX:-ecommerce}-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ecommerce_test}
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # The app is served over plain HTTP on localhost here. Set COOKIE_SECURE=true when it is
      # served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      # One proxy (the web container's nginx) sits in front of the API.
      TRUST_PROXY: 1
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}
      LOGIN_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_RATE_LIMIT_WINDOW_MINUTES:-15}
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-ecommerce}
      INSIGHTS_INTERVAL_MINUTES: ${INSIGHTS_INTERVAL_MINUTES:-30}
    command: ["node", "scripts/migrate.js", "up"]

  # REST API. Not published on the host: the web container proxies /api to it.
  api:
    <<: *backend
    container_name: ${CONTAINER_PREFIX:-ecommerce}-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "src/server.js"]

  # Publishes committed business events from the outbox table to Kafka.
  relay:
    <<: *backend
    container_name: ${CONTAINER_PREFIX:-ecommerce}-relay
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    command: ["node", "src/workers/outbox-relay.js"]
    healthcheck:
      # The relay reports liveness to PostgreSQL (pipeline_heartbeats), not over HTTP:
      # unhealthy when the heartbeat is stale or it reports publish errors (e.g. Kafka down).
      test: ["CMD", "node", "scripts/relay-healthcheck.js"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3

  # The web app (nginx): serves the React build and proxies /api to the API.
  web:
    build: ./frontend
    image: ecommerce-web:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_PREFIX:-ecommerce}-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

  # Spark Structured Streaming: Kafka → validation → Parquet history + PostgreSQL aggregates.
  spark-streaming:
    &analytics
    build: ./analytics
    image: ecommerce-analytics:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_PREFIX:-ecommerce}-spark-streaming
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      # The analytics tables are created by the backend migrations.
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-ecommerce_test}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-ecommerce}
    volumes:
      # Parquet history, quarantine, and streaming checkpoints.
      - analytics-data:/data
    ports:
      # Spark UI for the streaming job: http://localhost:4040
      - "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"
    healthcheck:
      # Healthy while the job keeps reporting heartbeats to PostgreSQL (see bin/healthcheck.py).
      test: ["CMD", "python3", "bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  # Batch job: rebuilds all aggregates from the Parquet history (run on demand).
  #   docker compose stop spark-streaming
  #   docker compose run --rm spark-rebuild
  #   docker compose start spark-streaming
  spark-rebuild:
    <<: *analytics
    container_name: ${CONTAINER_PREFIX:-ecommerce}-spark-rebuild
    restart: "no"
    profiles: [batch]
    ports: []
    healthcheck:
      disable: true
    command: ["spark-submit", "--driver-memory", "1g", "bin/rebuild_aggregates.py"]

  # Recompute customer segments, cohorts, and the forecast now (the streaming job also does
  # it every INSIGHTS_INTERVAL_MINUTES):
  #   docker compose run --rm spark-insights
  spark-insights:
    <<: *analytics
    container_name: ${CONTAINER_PREFIX:-ecommerce}-spark-insights
    restart: "no"
    profiles: [batch]
    ports: []
    healthcheck:
      disable: true
    command: ["spark-submit", "--driver-memory", "1g", "bin/compute_insights.py"]

  # Analytics test suite (uses the test database and a temporary data directory):
  #   docker compose run --rm analytics-tests
  analytics-tests:
    <<: *analytics
    container_name: ${CONTAINER_PREFIX:-ecommerce}-analytics-tests
    restart: "no"
    profiles: [test]
    ports: []
    healthcheck:
      disable: true
    volumes:
      # Mount the source so tests run against the working copy without rebuilding.
      - ./analytics:/app
    command: ["sh", "-c", "ruff check --no-cache . && ruff format --no-cache --check . && pytest -p no:cacheprovider"]

  # ---- Monitoring (optional) -------------------------------------------------------------
  # Prometheus scrapes the API's /api/metrics on the Compose network; Grafana shows the
  # provisioned "Commerce Analytics: API and pipeline" dashboard.
  #   docker compose --profile observability up -d
  #   Grafana: http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD), Prometheus: http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: ${CONTAINER_PREFIX:-ecommerce}-prometheus
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.3
    container_name: ${CONTAINER_PREFIX:-ecommerce}-grafana
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  kafka-data:
  analytics-data:
